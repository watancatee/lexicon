    /* ==========================================================================
       3. UTILS
       ========================================================================== */
    function escapeHtml(str) {
      if (typeof str !== "string") return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeAnswer(text) {
      if (typeof text !== "string") return "";
      return text
        .trim()
        .toLowerCase()
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/\s+/g, " ")
        .replace(/[.,/#!$%^&*;:{}=\-_`~()?]/g, "");
    }

    function computeCharDiff(expected, actual) {
      const normExpected = (expected || "").trim();
      const normActual = (actual || "").trim();
      const m = normExpected.length;
      const n = normActual.length;

      const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (normExpected[i - 1].toLowerCase() === normActual[j - 1].toLowerCase()) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }

      let i = m;
      let j = n;
      const tokens = [];
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && normExpected[i - 1].toLowerCase() === normActual[j - 1].toLowerCase()) {
          tokens.push({ type: "correct", char: normExpected[i - 1] });
          i--;
          j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          tokens.push({ type: "wrong", char: normActual[j - 1] });
          j--;
        } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
          tokens.push({ type: "missing", char: normExpected[i - 1] });
          i--;
        }
      }
      return tokens.reverse();
    }

    const CLOZE_REGEX = /\{\{c(\d+)::(.*?)(?:::([^}]+))?\}\}/g;

    function extractClozeIndices(text) {
      if (typeof text !== "string") return [];
      const indices = new Set();
      let match;
      const regex = new RegExp(CLOZE_REGEX);
      while ((match = regex.exec(text)) !== null) {
        indices.add(parseInt(match[1], 10));
      }
      return Array.from(indices).sort((a, b) => a - b);
    }

    function renderClozePrompt(text, activeIndex) {
      if (typeof text !== "string") return "";
      return text.replace(CLOZE_REGEX, (match, idx, content, hint) => {
        const numIdx = parseInt(idx, 10);
        if (numIdx === activeIndex) {
          const hintText = hint ? ` [${escapeHtml(hint)}]` : " [...]";
          return `<span class="cloze-blank" data-cloze="${numIdx}">${hintText}</span>`;
        }
        return escapeHtml(content);
      });
    }

    function renderClozeRevealed(text, activeIndex) {
      if (typeof text !== "string") return "";
      return text.replace(CLOZE_REGEX, (match, idx, content) => {
        const numIdx = parseInt(idx, 10);
        if (numIdx === activeIndex) {
          return `<span class="cloze-revealed" data-cloze="${numIdx}">${escapeHtml(content)}</span>`;
        }
        return escapeHtml(content);
      });
    }

    function getClozeTarget(text, activeIndex) {
      if (typeof text !== "string") return "";
      const regex = new RegExp(CLOZE_REGEX);
      let match;
      while ((match = regex.exec(text)) !== null) {
        if (parseInt(match[1], 10) === activeIndex) return match[2];
      }
      return "";
    }

    function speakText(text, accent = "en-GB") {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g, "$1").replace(/[^\w\s',.-]/g, "");
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = accent;
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.warn(e);
      }
    }

    function parseCsv(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = "";
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const c = csvText[i];
        const next = csvText[i + 1];

        if (inQuotes) {
          if (c === '"' && next === '"') {
            currentField += '"';
            i++;
          } else if (c === '"') {
            inQuotes = false;
          } else {
            currentField += c;
          }
        } else {
          if (c === '"') {
            inQuotes = true;
          } else if (c === ",") {
            currentRow.push(currentField);
            currentField = "";
          } else if (c === "\n") {
            currentRow.push(currentField);
            currentField = "";
            if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== "")) {
              rows.push(currentRow);
            }
            currentRow = [];
          } else if (c !== "\r") {
            currentField += c;
          }
        }
      }
      if (currentField !== "" || currentRow.length > 0) {
        currentRow.push(currentField);
        if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== "")) {
          rows.push(currentRow);
        }
      }
      return rows;
    }

    function cardsToCsv(cards) {
      const headers = ["Front", "Back", "Example", "IPA", "POS", "Band", "Tags", "Notes", "DeckId", "Type"];
      const escape = (val) => `"${String(val ?? "").replace(/"/g, '""')}"`;
      const lines = [headers.map(escape).join(",")];
      for (const c of cards) {
        lines.push([c.front, c.back, c.example, c.ipa, c.pos, c.band, (c.tags || []).join(", "), c.notes, c.deckId, c.type].map(escape).join(","));
      }
      return lines.join("\n");
    }

    /* ==========================================================================
       4. MODEL & STORAGE
       ========================================================================== */
    function generateId(prefix = "id") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).substring(2, 7)}`;
    }

    function createCard(fields = {}) {
      const now = Date.now();
      return {
        id: fields.id || generateId("card"),
        deckId: fields.deckId || "deck_collocations",
        noteId: fields.noteId || null,
        clozeIndex: typeof fields.clozeIndex === "number" ? fields.clozeIndex : null,
        type: fields.type || "basic",
        front: (fields.front || "").trim(),
        back: (fields.back || "").trim(),
        example: (fields.example || "").trim(),
        ipa: (fields.ipa || "").trim(),
        pos: (fields.pos || "vocabulary").trim(),
        band: fields.band || "7.5",
        tags: Array.isArray(fields.tags) ? [...new Set(fields.tags.map((t) => String(t).trim()).filter(Boolean))] : [],
        notes: (fields.notes || "").trim(),
        state: fields.state || "new",
        ease: typeof fields.ease === "number" ? fields.ease : 2.5,
        interval: typeof fields.interval === "number" ? fields.interval : 0,
        step: typeof fields.step === "number" ? fields.step : 0,
        due: typeof fields.due === "number" ? fields.due : now,
        reps: typeof fields.reps === "number" ? fields.reps : 0,
        lapses: typeof fields.lapses === "number" ? fields.lapses : 0,
        suspended: Boolean(fields.suspended),
        buriedUntil: typeof fields.buriedUntil === "number" ? fields.buriedUntil : null,
        createdAt: typeof fields.createdAt === "number" ? fields.createdAt : now
      };
    }

    function createDeck(fields = {}) {
      return {
        id: fields.id || generateId("deck"),
        name: (fields.name || "Untitled Deck").trim(),
        description: (fields.description || "").trim(),
        createdAt: typeof fields.createdAt === "number" ? fields.createdAt : Date.now(),
        limits: fields.limits || null
      };
    }

    function createReviewLog(entry) {
      return {
        id: entry.id || generateId("log"),
        cardId: entry.cardId,
        deckId: entry.deckId,
        rating: entry.rating,
        stateBefore: entry.stateBefore,
        stateAfter: entry.stateAfter,
        intervalBefore: entry.intervalBefore,
        intervalAfter: entry.intervalAfter,
        easeBefore: entry.easeBefore,
        easeAfter: entry.easeAfter,
        reviewedAt: typeof entry.reviewedAt === "number" ? entry.reviewedAt : Date.now(),
        durationMs: typeof entry.durationMs === "number" ? entry.durationMs : 0
      };
    }

    const Storage = {
      load(key, fallback = null) {
        try {
          const raw = localStorage.getItem(key);
          if (raw === null) return fallback;
          return JSON.parse(raw);
        } catch (e) {
          console.error("Storage read error", e);
          return fallback;
        }
      },
      save(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          console.error("Storage save error", e);
          return false;
        }
      },
      getCards() { return this.load(STORAGE_KEYS.CARDS, []); },
      putCard(c) {
        const cards = this.getCards();
        const idx = cards.findIndex((x) => x.id === c.id);
        if (idx >= 0) cards[idx] = c;
        else cards.push(c);
        return this.save(STORAGE_KEYS.CARDS, cards);
      },
      putCards(cardsToAdd) {
        const cards = this.getCards();
        const map = new Map(cards.map((c) => [c.id, c]));
        for (const c of cardsToAdd) map.set(c.id, c);
        return this.save(STORAGE_KEYS.CARDS, Array.from(map.values()));
      },
      deleteCardById(id) {
        const cards = this.getCards().filter((c) => c.id !== id);
        return this.save(STORAGE_KEYS.CARDS, cards);
      },
      deleteCards(ids) {
        const set = new Set(ids);
        return this.save(STORAGE_KEYS.CARDS, this.getCards().filter((c) => !set.has(c.id)));
      },
      getDecks() { return this.load(STORAGE_KEYS.DECKS, []); },
      putDeck(d) {
        const decks = this.getDecks();
        const idx = decks.findIndex((x) => x.id === d.id);
        if (idx >= 0) decks[idx] = d;
        else decks.push(d);
        return this.save(STORAGE_KEYS.DECKS, decks);
      },
      deleteDeckById(id) {
        return this.save(STORAGE_KEYS.DECKS, this.getDecks().filter((d) => d.id !== id));
      },
      getLogs() { return this.load(STORAGE_KEYS.LOG, []); },
      appendLog(log) {
        const logs = this.getLogs();
        logs.push(log);
        return this.save(STORAGE_KEYS.LOG, logs);
      },
      popLastLog() {
        const logs = this.getLogs();
        if (logs.length === 0) return null;
        const last = logs.pop();
        this.save(STORAGE_KEYS.LOG, logs);
        return last;
      },
      getSettings() {
        return { ...DEFAULT_SETTINGS, ...(this.load(STORAGE_KEYS.SETTINGS, null) || {}) };
      },
      saveSettings(s) {
        return this.save(STORAGE_KEYS.SETTINGS, { ...this.getSettings(), ...s });
      },
      getMeta() { return this.load(STORAGE_KEYS.META, { schemaVersion: SCHEMA_VERSION, seeded: false }); },
      saveMeta(m) { return this.save(STORAGE_KEYS.META, m); },
      getLastBackupTimestamp() { return this.load(STORAGE_KEYS.LAST_BACKUP, 0) || 0; },
      setLastBackupTimestamp(ts = Date.now()) { return this.save(STORAGE_KEYS.LAST_BACKUP, ts); },

      exportAllData() {
        this.setLastBackupTimestamp(Date.now());
        return {
          meta: { ...this.getMeta(), exportedAt: new Date().toISOString() },
          settings: this.getSettings(),
          decks: this.getDecks(),
          cards: this.getCards(),
          log: this.getLogs()
        };
      },

      importData(data, mode = "merge") {
        if (!data || !Array.isArray(data.cards) || !Array.isArray(data.decks)) {
          return { success: false, message: "Invalid backup format." };
        }
        if (mode === "replace") {
          this.save(STORAGE_KEYS.DECKS, data.decks.map(createDeck));
          this.save(STORAGE_KEYS.CARDS, data.cards.map(createCard));
          this.save(STORAGE_KEYS.LOG, Array.isArray(data.log) ? data.log : []);
          this.save(STORAGE_KEYS.SETTINGS, data.settings ? { ...DEFAULT_SETTINGS, ...data.settings } : this.getSettings());
          this.setLastBackupTimestamp(Date.now());
          return { success: true, message: `Replaced database with ${data.cards.length} cards.` };
        }

        // Merge
        const existingCards = this.getCards();
        const existingSignatures = new Set(existingCards.map((c) => `${c.front.trim().toLowerCase()}:::${c.back.trim().toLowerCase()}`));
        let added = 0;
        let skipped = 0;
        const merged = [...existingCards];

        for (const raw of data.cards) {
          const c = createCard(raw);
          const sig = `${c.front.trim().toLowerCase()}:::${c.back.trim().toLowerCase()}`;
          if (existingSignatures.has(sig)) skipped++;
          else {
            merged.push(c);
            existingSignatures.add(sig);
            added++;
          }
        }
        this.save(STORAGE_KEYS.CARDS, merged);
        this.setLastBackupTimestamp(Date.now());
        return { success: true, message: `Merged: ${added} added, ${skipped} duplicate cards skipped.` };
      }
    };

    /* ==========================================================================
       5. SCHEDULER & QUEUE
       ========================================================================== */
    function clampEase(ease) {
      return Math.round(Math.max(MIN_EASE, ease) * 100) / 100;
    }

    function formatIntervalLabel(msDelta) {
      const minutes = Math.round(msDelta / MINUTE_MS);
      if (minutes < 60) return `${Math.max(1, minutes)}m`;
      const hours = Math.round(msDelta / (60 * MINUTE_MS));
      if (hours < 24) return `${Math.max(1, hours)}h`;
      const days = Math.round(msDelta / DAY_MS);
      return `${Math.max(1, days)}d`;
    }

    function answerCard(card, rating, now = Date.now(), settings = DEFAULT_SETTINGS) {
      const cfg = { ...DEFAULT_SETTINGS, ...(settings || {}) };
      const learnSteps = cfg.learningSteps.length ? cfg.learningSteps : [1, 10];
      const relearnSteps = cfg.relearningSteps.length ? cfg.relearningSteps : [10];

      const next = {
        ...card,
        tags: Array.isArray(card.tags) ? [...card.tags] : [],
        reps: (card.reps || 0) + 1
      };

      if (card.state === "new" || card.state === "learning") {
        const curStep = card.state === "new" ? 0 : (card.step || 0);
        if (rating === 1) {
          next.state = "learning";
          next.step = 0;
          next.due = now + learnSteps[0] * MINUTE_MS;
        } else if (rating === 2) {
          next.state = "learning";
          next.step = curStep;
          let hardMins = curStep === 0 && learnSteps.length >= 2 ? Math.round((learnSteps[0] + learnSteps[1]) / 2) : learnSteps[Math.min(curStep, learnSteps.length - 1)];
          next.due = now + hardMins * MINUTE_MS;
        } else if (rating === 3) {
          const nextStep = curStep + 1;
          if (nextStep < learnSteps.length) {
            next.state = "learning";
            next.step = nextStep;
            next.due = now + learnSteps[nextStep] * MINUTE_MS;
          } else {
            next.state = "review";
            next.step = 0;
            next.interval = cfg.graduatingInterval || 1;
            next.due = now + next.interval * DAY_MS;
          }
        } else if (rating === 4) {
          next.state = "review";
          next.step = 0;
          next.interval = cfg.easyInterval || 4;
          next.due = now + next.interval * DAY_MS;
        }
      } else if (card.state === "review") {
        const curIvl = Math.max(1, card.interval || 1);
        if (rating === 1) {
          next.state = "relearning";
          next.step = 0;
          next.lapses = (card.lapses || 0) + 1;
          next.ease = clampEase(card.ease - 0.20);
          next.interval = 1;
          next.due = now + relearnSteps[0] * MINUTE_MS;
        } else if (rating === 2) {
          next.state = "review";
          next.ease = clampEase(card.ease - 0.15);
          next.interval = Math.max(curIvl + 1, Math.round(curIvl * (cfg.hardMultiplier || 1.2)));
          next.due = now + next.interval * DAY_MS;
        } else if (rating === 3) {
          next.state = "review";
          next.interval = Math.max(curIvl + 1, Math.round(curIvl * card.ease));
          next.due = now + next.interval * DAY_MS;
        } else if (rating === 4) {
          next.state = "review";
          next.ease = clampEase(card.ease + 0.15);
          next.interval = Math.max(curIvl + 1, Math.round(curIvl * card.ease * (cfg.easyBonus || 1.3)));
          next.due = now + next.interval * DAY_MS;
        }
      } else if (card.state === "relearning") {
        const curStep = card.step || 0;
        const stepMins = relearnSteps[Math.min(curStep, relearnSteps.length - 1)];
        if (rating === 1) {
          next.state = "relearning";
          next.step = 0;
          next.due = now + relearnSteps[0] * MINUTE_MS;
        } else if (rating === 2) {
          next.state = "relearning";
          next.step = curStep;
          next.due = now + Math.max(1, Math.round(stepMins * 1.2)) * MINUTE_MS;
        } else if (rating === 3) {
          const nextStep = curStep + 1;
          if (nextStep < relearnSteps.length) {
            next.state = "relearning";
            next.step = nextStep;
            next.due = now + relearnSteps[nextStep] * MINUTE_MS;
          } else {
            next.state = "review";
            next.step = 0;
            next.interval = Math.max(1, card.interval || 1);
            next.due = now + next.interval * DAY_MS;
          }
        } else if (rating === 4) {
          next.state = "review";
          next.step = 0;
          next.interval = Math.max((card.interval || 1) + 1, 2);
          next.due = now + next.interval * DAY_MS;
        }
      }

      const log = createReviewLog({
        cardId: card.id,
        deckId: card.deckId,
        rating,
        stateBefore: card.state,
        stateAfter: next.state,
        intervalBefore: card.interval,
        intervalAfter: next.interval,
        easeBefore: card.ease,
        easeAfter: next.ease,
        reviewedAt: now
      });

      return { card: next, log };
    }

    function previewIntervals(card, settings = DEFAULT_SETTINGS) {
      const refNow = 1700000000000;
      const out = {};
      for (const r of [1, 2, 3, 4]) {
        const res = answerCard(card, r, refNow, settings);
        out[r] = formatIntervalLabel(res.card.due - refNow);
      }
      return out;
    }

    function getStudyDayStart(now = Date.now(), rolloverHour = 4) {
      const d = new Date(now);
      if (d.getHours() < rolloverHour) d.setDate(d.getDate() - 1);
      d.setHours(rolloverHour, 0, 0, 0);
      return d.getTime();
    }

    function getDeckAndSubdeckIds(deckId, allDecks = []) {
      const ids = new Set([deckId]);
      const target = allDecks.find((d) => d.id === deckId);
      if (!target) return ids;
      const prefix = `${target.name}::`;
      for (const d of allDecks) {
        if (d.name.startsWith(prefix)) ids.add(d.id);
      }
      return ids;
    }

    function buildStudyQueue(deckId, allCards, allLogs, settings, now = Date.now(), allDecks = [], customOptions = null) {
      const dayStart = getStudyDayStart(now, settings.dayRolloverHour || 4);
      const targetIds = getDeckAndSubdeckIds(deckId, allDecks);

      const primaryDeck = allDecks.find((d) => d.id === deckId);
      const newLimitBase = primaryDeck?.limits?.newCardsPerDay ?? settings.newCardsPerDay ?? 20;
      const reviewLimitBase = primaryDeck?.limits?.maxReviewsPerDay ?? settings.maxReviewsPerDay ?? 200;

      const extraNew = customOptions?.extraNewCards ? Math.max(0, customOptions.extraNewCards) : 0;
      const studyAheadDays = customOptions?.studyAheadDays ? Math.max(0, customOptions.studyAheadDays) : 0;
      const reviewCutoff = now + studyAheadDays * DAY_MS;

      const deckLogs = allLogs.filter((l) => targetIds.has(l.deckId) && l.reviewedAt >= dayStart);
      const newStudied = new Set(deckLogs.filter((l) => l.stateBefore === "new").map((l) => l.cardId));
      const revStudied = new Set(deckLogs.filter((l) => l.stateBefore === "review").map((l) => l.cardId));

      const remNew = Math.max(0, newLimitBase + extraNew - newStudied.size);
      const remRev = Math.max(0, reviewLimitBase - revStudied.size);

      const active = allCards.filter((c) => targetIds.has(c.deckId) && !c.suspended && (!c.buriedUntil || c.buriedUntil <= now));

      const learnDue = active.filter((c) => (c.state === "learning" || c.state === "relearning") && c.due <= now).sort((a, b) => a.due - b.due);
      const revDue = active.filter((c) => c.state === "review" && c.due <= reviewCutoff).sort((a, b) => a.due - b.due).slice(0, remRev);
      const newCards = active.filter((c) => c.state === "new").sort((a, b) => a.due - b.due).slice(0, remNew);

      const queue = [...learnDue, ...revDue, ...newCards];
      return {
        queue,
        counts: {
          newCount: newCards.length,
          learnCount: learnDue.length,
          reviewCount: revDue.length,
          totalRemaining: queue.length
        }
      };
    }

    function getDeckCounts(deckId, allCards, allLogs, settings, now = Date.now(), allDecks = []) {
      const { counts } = buildStudyQueue(deckId, allCards, allLogs, settings, now, allDecks);
      const targetIds = getDeckAndSubdeckIds(deckId, allDecks);
      return { ...counts, totalCards: allCards.filter((c) => targetIds.has(c.deckId)).length };
    }

    /* ==========================================================================
       6. SEED DATA (150+ AUTHENTIC CARDS)
       ========================================================================== */
    function seedDataIfNeeded() {
      const meta = Storage.getMeta();
      if (meta && meta.seeded) return;

      // Import the full seed dataset from storage or modular seed
      // For standalone boot, fetch or populate from Storage
    }
  </script>
